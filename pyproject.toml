[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-assistant-agent"
version = "0.1.0"
description = "Local-first email assistant with Microsoft Graph, Obsidian, and Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "msal>=1.28",
    "ollama>=0.4",
    "msgraph-sdk>=1.0",
    "azure-identity>=1.15",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
]
azure = [
    "azure-functions>=1.20",
    "azure-data-tables>=12.5",
    "azure-storage-blob>=12.19",
    "azure-storage-queue>=12.9",
]

[project.scripts]
email-assistant = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
